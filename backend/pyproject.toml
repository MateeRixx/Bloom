[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:skimage.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".venv",
    "evaluation/images",
    "evaluation/ground_truth",
    "evaluation/predictions",
    "evaluation/results",
    "experiments/output",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
